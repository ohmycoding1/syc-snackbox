<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a49">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>도난 방지 간식 보관함</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1b2a49; --bg2: #243660; --fg: #fff8e7; --muted: #a9b7d6; --panel: #2b3f70; --line: #46609c;
  --yellow: #ffc93c; --mint: #5eead4; --alarm: #ff4d5e; --alarm-bg: #4a1626; --green: #4ade80;
}
* { box-sizing: border-box; }
html { height: 100%; background: #1b2a49; }
body {
  margin: 0; min-height: 100%;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  background: radial-gradient(circle at 50% -10%, var(--bg2), var(--bg) 60%) fixed;
  color: var(--fg); font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  display: flex; justify-content: center;
}
body.alarm { background: radial-gradient(circle at 50% 30%, #7a1f33, var(--alarm-bg) 65%) fixed; }
main { width: 100%; max-width: 460px; padding: 18px 18px 44px; }
.snacks { text-align: center; font-size: 24px; letter-spacing: 6px; }
h1 { font-size: 28px; margin: 4px 0 6px; text-align: center; color: var(--yellow); text-shadow: 0 3px 0 #0006; }

/* 연결 상태 줄 */
.conn { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.conn span { display: inline-flex; align-items: center; gap: 6px; }
.conn i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #888; }
.conn i.on { background: var(--mint); box-shadow: 0 0 0 4px #5eead433; }
.conn i.mid { background: var(--yellow); }
.conn i.off { background: var(--alarm); }

/* 금고 */
.status { text-align: center; padding: 4px 0 4px; }
.vault {
  width: 210px; height: 210px; margin: 0 auto; border-radius: 50%; padding: 14px;
  background: conic-gradient(#8c99b8, #dfe6f5, #8c99b8, #dfe6f5, #8c99b8); box-shadow: 0 10px 0 #0005;
}
.door {
  width: 100%; height: 100%; border-radius: 50%; border: 6px solid #1b2a49;
  background: radial-gradient(circle at 35% 30%, #4a5f93, #2b3f70);
  display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 6px var(--mint);
  transition: box-shadow .3s, background .3s;
}
.icon { font-size: 68px; line-height: 1; }
.status.alarm .door { box-shadow: inset 0 0 0 6px var(--alarm); background: radial-gradient(circle at 35% 30%, #a8283c, #5a1427); }
.status.alarm .vault { animation: shake .4s 4, glow 1s infinite; }
.status.open .door { box-shadow: inset 0 0 0 6px var(--yellow); }
.status.setup .door { box-shadow: inset 0 0 0 6px #c4b5fd; }
.status.off .door { box-shadow: inset 0 0 0 6px var(--line); }
.state { font-size: 28px; margin: 16px 0 2px; color: var(--mint); }
.status.alarm .state { color: #ff8a96; }
.status.open .state { color: var(--yellow); }
.status.setup .state { color: #c4b5fd; }
.status.off .state { color: var(--muted); }
.time { color: var(--muted); font-size: 15px; min-height: 20px; }

/* 비밀번호 입력 진행 */
.dots { display: flex; justify-content: center; gap: 12px; margin: 14px 0 4px; }
.dots b { width: 18px; height: 18px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); transition: all .15s; }
.dots b.fill { background: var(--yellow); border-color: var(--yellow); transform: scale(1.2); box-shadow: 0 0 12px #ffc93c88; }
.dotsTxt { text-align: center; font-size: 14px; color: var(--muted); min-height: 20px; }
.dotsTxt.active { color: var(--yellow); }

/* 숫자 */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.stat { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px 8px; text-align: center; }
.stat b { display: block; font-size: 26px; font-weight: normal; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.ok b { color: var(--green); }
.stat.bad b { color: #ff8a96; }

/* 버튼 */
.row { display: flex; gap: 10px; margin-top: 14px; }
button {
  font: inherit; font-size: 17px; border: 0; border-radius: 16px; padding: 14px 8px; cursor: pointer; flex: 1;
  background: var(--yellow); color: #1b2a49; box-shadow: 0 5px 0 #b88a00;
}
button:active { transform: translateY(4px); box-shadow: 0 1px 0 #b88a00; }
button.ghost { background: var(--panel); color: var(--fg); box-shadow: 0 5px 0 #14213d; }
button.ghost:active { box-shadow: 0 1px 0 #14213d; }
button:disabled { opacity: .45; cursor: default; transform: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

/* 카드 */
.card { background: var(--panel); border-radius: 20px; padding: 4px 16px 16px; margin-top: 20px; border: 2px solid var(--line); }
h2 { font-size: 19px; margin: 16px 0 6px; color: var(--yellow); font-weight: normal; }
h3 { font-size: 15px; margin: 16px 0 4px; color: var(--muted); font-weight: normal; }
label.f { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
input[type=text] { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); }
.tg { display: flex; align-items: center; gap: 10px; padding: 8px 4px; font-size: 16px; cursor: pointer; }
.tg input { width: 20px; height: 20px; accent-color: var(--yellow); flex: none; }
.tg small { display: block; font-size: 12px; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; background: var(--bg); border-radius: 14px; max-height: 320px; overflow-y: auto; }
li { padding: 11px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
li:last-child { border-bottom: 0; }
li.empty { color: var(--muted); }
li span:last-child { color: var(--muted); font-size: 13px; white-space: nowrap; }
.hidden { display: none; }
.hint {
  margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: #ffc93c22; border: 2px solid var(--yellow);
  font-size: 15px; line-height: 1.5; color: var(--fg);
}
.hint b { color: var(--yellow); font-weight: normal; }
.hint button { margin-top: 10px; width: 100%; }
.diag { font-size: 13px; color: var(--muted); line-height: 1.7; }
.diag code { color: var(--mint); font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
.raw li { font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding: 8px 12px; }
.raw li span:first-child { word-break: break-all; }
/* 디버그 로그 */
.dbgbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.dbgbar button { flex: 1 1 30%; font-size: 14px; padding: 10px 6px; }
.dbgsum { font-size: 13px; line-height: 1.7; background: var(--bg); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
.dbgsum .bad { color: #ff8a96; } .dbgsum .good { color: var(--green); } .dbgsum .mid { color: var(--yellow); }
#dbg { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; line-height: 1.45; max-height: 420px; }
#dbg li { display: block; padding: 6px 10px; word-break: break-all; white-space: pre-wrap; }
#dbg li.e { color: #ff8a96; background: #ff4d5e18; }
#dbg li.w { color: var(--yellow); }
#dbg li.i { color: var(--fg); }
#dbg li.t { color: var(--muted); }
#dbg li.r { color: var(--mint); }
.note { font-size: 13px; color: var(--muted); margin-top: 18px; line-height: 1.6; text-align: center; }

/* 화면 위 작은 알림 */
.toasts {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: min(430px, calc(100vw - 24px)); z-index: 50; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  pointer-events: auto; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 18px;
  background: #fff8e7; color: #1b2a49; box-shadow: 0 6px 0 #0005; border: 3px solid var(--mint);
  animation: drop .25s ease-out;
}
.toast.leave { animation: rise .25s ease-in forwards; }
.toast .em { font-size: 30px; line-height: 1; flex: none; }
.toast .tx { flex: 1; min-width: 0; }
.toast b { display: block; font-size: 18px; font-weight: normal; }
.toast span { display: block; font-size: 13px; color: #4a5a80; margin-top: 2px; }
.toast.c-try { border-color: var(--yellow); }
.toast.c-fail { border-color: var(--alarm); }
.toast.c-ok { border-color: var(--green); }
.toast.c-info { border-color: #c4b5fd; }
.toast:nth-child(n+3) { display: none; }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
@keyframes rise { to { transform: translateY(-30px); opacity: 0; } }

/* 큰 경보 화면 */
.overlay {
  position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 24px;
  background: radial-gradient(circle at 50% 35%, #a8283c, #3a0f1d 70%);
}
.overlay.show { display: flex; animation: pulse 1s ease-in-out infinite alternate; }
.overlay .box { text-align: center; max-width: 380px; }
.overlay .em { font-size: 96px; line-height: 1; animation: shake .4s infinite; display: inline-block; }
.overlay h2 { font-size: 34px; color: #fff; margin: 18px 0 8px; text-shadow: 0 3px 0 #0006; }
.overlay p { font-size: 18px; margin: 0 0 6px; color: #ffd9dd; line-height: 1.5; }
.overlay .when { font-size: 14px; color: #ffb3bb; margin-bottom: 26px; }
.overlay button { background: #fff8e7; color: #a8283c; box-shadow: 0 5px 0 #0007; font-size: 20px; padding: 16px 36px; flex: none; }
.overlay.off { background: radial-gradient(circle at 50% 35%, #46609c, #141f38 70%); }
.overlay.off .em { animation: none; }
.overlay.off button { color: #1b2a49; }

@keyframes shake { 25% { transform: translateX(-8px) rotate(-2deg); } 75% { transform: translateX(8px) rotate(2deg); } }
@keyframes glow { 50% { box-shadow: 0 10px 0 #0005, 0 0 40px 12px #ff4d5e99; } }
@keyframes pulse { to { filter: brightness(1.25); } }
@media (prefers-reduced-motion: reduce) {
  .status.alarm .vault, .overlay .em, .overlay.show { animation: none; }
}
</style>
</head>
<body>
<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="overlay" id="overlay" role="alertdialog" aria-labelledby="ovTitle">
  <div class="box">
    <div class="em" id="ovEm">🚨</div>
    <h2 id="ovTitle">경보!</h2>
    <p id="ovText"></p>
    <div class="when" id="ovWhen"></div>
    <button id="ovClose">확인했어요</button>
  </div>
</div>

<main>
  <div class="snacks" aria-hidden="true">🍪🍫🍬🍩</div>
  <h1>도난 방지 간식 보관함</h1>
  <div class="conn">
    <span><i id="btDot" class="off"></i><span id="btTxt">블루투스 연결 안 됨</span></span>
    <span><i id="boxDot"></i><span id="boxTxt">보관함 신호 없음</span></span>
  </div>

  <section class="status off" id="status" aria-live="assertive">
    <div class="vault"><div class="door"><div class="icon" id="icon">🔗</div></div></div>
    <div class="state" id="state">보관함을 연결하세요</div>
    <div class="time" id="time"></div>
  </section>

  <div class="hint hidden" id="hint"></div>

  <div class="row">
    <button id="connect">🔗 보관함 연결 (블루투스)</button>
    <button class="ghost hidden" id="disconnect" style="flex:0 0 110px">연결 끊기</button>
  </div>

  <div class="dots" id="dots"></div>
  <div class="dotsTxt" id="dotsTxt"></div>

  <div class="stats">
    <div class="stat"><b id="nPress">0</b><span>버튼 입력</span></div>
    <div class="stat ok"><b id="nOk">0</b><span>해제 성공</span></div>
    <div class="stat bad"><b id="nFail">0</b><span>해제 실패</span></div>
  </div>

  <div class="row">
    <button id="lock" disabled>🔒 잠그기</button>
    <button class="ghost" id="quiet">🔕 소리 끄기</button>
  </div>
  <div class="row">
    <button class="ghost" id="ping" disabled>📡 보관함 확인</button>
    <button class="ghost" id="gear" aria-label="설정" style="flex:0 0 56px">⚙️</button>
  </div>

  <div class="card hidden" id="setcard">
    <h2>설정</h2>
    <h3>어떤 일이 생기면 알려 줄까요?</h3>
    <div id="alertToggles"></div>

    <h3>어떻게 알려 줄까요?</h3>
    <label class="tg"><input type="checkbox" data-opt="sound" checked><span>🔊 소리<small>경보는 사이렌처럼 크게</small></span></label>
    <label class="tg"><input type="checkbox" data-opt="voice" checked><span>🗣️ 말로 읽어 주기<small>"해제에 실패했어요"처럼 읽어 줘요</small></span></label>
    <label class="tg"><input type="checkbox" data-opt="vibrate" checked><span>📳 진동<small>진동이 되는 휴대폰에서만</small></span></label>
    <label class="tg"><input type="checkbox" data-opt="push" checked><span>🔔 앱 밖 알림<small>다른 화면을 보고 있을 때 알림 (처음에 허용 필요)</small></span></label>

    <div class="row">
      <button class="ghost" id="testToast">알림 미리 보기</button>
      <button class="ghost" id="testAlarm">경보 미리 보기</button>
    </div>
  </div>

  <div class="card">
    <h2>기록</h2>
    <ul id="log"><li class="empty">아직 기록이 없어요.</li></ul>
    <div class="row"><button class="ghost" id="wipe">기록 지우기</button></div>
  </div>

  <div class="card" id="dbgcard">
    <h2>🛠 디버그 로그</h2>
    <div class="dbgsum" id="dbgsum"></div>
    <div class="dbgbar">
      <button class="ghost" id="dbgCopy">📋 로그 복사</button>
      <button class="ghost" id="dbgTest">🧪 응답 테스트</button>
      <button class="ghost" id="dbgClear">🧹 지우기</button>
    </div>
    <ul id="dbg"></ul>
  </div>

  <p class="note">PC·안드로이드의 <b>Chrome</b>(또는 Edge)에서 열어 주세요.<br>아이폰은 App Store의 <b>Bluefy</b> 앱으로 이 주소를 열어야 해요.<br>블루투스는 약 10m 안에서, 한 번에 기기 1대만 연결돼요.</p>
</main>

<script>
// ===================== 디버그 로그 (가장 먼저 실행) =====================
var DBG = [];
var DBG_MAX = 500;
var DBG_T0 = Date.now();
var dbgStat = { connects: 0, drops: 0, retries: 0, lines: 0, sent: 0, errors: 0, lastErr: "" };
function dbgTime(t) {
  var d = new Date(t);
  function z(n, l) { n = String(n); while (n.length < (l || 2)) { n = "0" + n; } return n; }
  return z(d.getHours()) + ":" + z(d.getMinutes()) + ":" + z(d.getSeconds()) + "." + z(d.getMilliseconds(), 3);
}
function dbgStr(x) {
  if (x === undefined) { return ""; }
  if (x instanceof Error || (x && x.name && x.message)) { return x.name + ": " + x.message; }
  if (typeof x === "string") { return x; }
  try { return JSON.stringify(x); } catch (e) { return String(x); }
}
// level: e=오류, w=경고, i=정보, t=자세히, r=받은 신호
function dbg(level, msg, data) {
  var line = { t: Date.now(), l: level, m: msg + (data !== undefined ? "  " + dbgStr(data) : "") };
  DBG.push(line);
  if (DBG.length > DBG_MAX) { DBG.shift(); }
  if (level === "e") { dbgStat.errors++; dbgStat.lastErr = line.m; }
  try { (level === "e" ? console.error : level === "w" ? console.warn : console.log)("[vault " + dbgTime(line.t) + "] " + line.m); } catch (e) {}
  var ul = document.getElementById("dbg");
  if (!ul) { return; }
  var li = document.createElement("li");
  li.className = level;
  li.textContent = dbgTime(line.t) + " " + ({ e: "❌", w: "⚠️", i: "ℹ️", t: "·", r: "📥" }[level] || "") + " " + line.m;
  ul.insertBefore(li, ul.firstChild);
  while (ul.children.length > DBG_MAX) { ul.removeChild(ul.lastChild); }
}
window.addEventListener("error", function (e) {
  if (e.target && e.target !== window && (e.target.src || e.target.href)) {
    dbg("e", "파일을 불러오지 못함: " + (e.target.src || e.target.href));
  } else {
    dbg("e", "스크립트 오류: " + e.message + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno + ":" + e.colno);
  }
}, true);
window.addEventListener("unhandledrejection", function (e) { dbg("e", "처리 안 된 Promise 오류", e.reason); });
document.addEventListener("visibilitychange", function () {
  dbg(document.hidden ? "w" : "i", document.hidden ? "앱이 백그라운드로 감 (블루투스 연결은 유지될 수도, 끊길 수도 있어요)" : "앱이 다시 화면에 나옴");
});

var UA = navigator.userAgent;
var IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
var IN_APP = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(UA);
dbg("i", "앱 시작 · " + location.href);
dbg("t", "브라우저: " + UA);
dbg("t", "보안 연결(isSecureContext)=" + window.isSecureContext + " · navigator.bluetooth=" + !!navigator.bluetooth);

// ===================== 설정값 =====================
var UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";  // micro:bit 블루투스 UART 서비스
var PW_LENGTH = 4;            // 마이크로비트의 PW_LENGTH와 같게
var OFFLINE_AFTER = 15000;    // 연결은 돼 있는데 이 시간 동안 신호가 없으면 "신호 끊김" (보관함은 5초마다 신호)
var TOAST_TIME = 6000;
var TAMPER_GAP = 60000;

// =====================================================================
//  마이크로비트와 주고받는 약속 (블루투스 UART, 한 줄에 하나, 끝은 줄바꿈)
//   보관함 → 앱 : boot, hello, setup, pwset, locked, press:2/4, ok, fail:1,
//                alarm, tamper, clear, alive:locked (5초마다), state:locked
//   앱 → 보관함 : ping (상태 다시 보내기), lock (열려 있을 때 잠그기)
// =====================================================================

var ALERTS = {
  pwset:   { em: "🔑", name: "비밀번호를 설정했어요",  desc: "새 비밀번호를 저장했을 때",          color: "info", big: false },
  try:     { em: "👆", name: "누군가 해제를 시도해요", desc: "잠긴 보관함 버튼을 처음 눌렀을 때",   color: "try",  big: false },
  fail:    { em: "❌", name: "해제에 실패했어요",      desc: "비밀번호가 틀렸을 때",              color: "fail", big: false },
  ok:      { em: "🔓", name: "해제에 성공했어요",      desc: "비밀번호가 맞아서 열렸을 때",        color: "ok",   big: false },
  alarm:   { em: "🚨", name: "경보가 울렸어요",        desc: "연속으로 틀려서 입력이 막혔을 때",    color: "alarm", big: true },
  offline: { em: "📡", name: "보관함 연결이 끊겼어요",  desc: "멀어지거나 전원이 꺼져 블루투스가 끊겼을 때", color: "off", big: true }
};
var ALERT_ORDER = ["pwset", "try", "fail", "ok", "alarm", "offline"];

var VIEWS = {
  locked: { cls: "",      icon: "🔒", text: "잠겨 있어요" },
  open:   { cls: "open",  icon: "🍪", text: "보관함이 열렸어요" },
  setup:  { cls: "setup", icon: "🔑", text: "비밀번호 설정 중" },
  alarm:  { cls: "alarm", icon: "🚨", text: "경보! 입력 차단 중" }
};

// ---------------- 저장소 ----------------
function getItem(key, fallback) {
  try { var v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
}
function setItem(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function getJson(key, fallback) {
  try { return JSON.parse(getItem(key, "")) || fallback; } catch (e) { return fallback; }
}
var alertOn = getJson("vb-alerts", {});
var optOn = getJson("vb-opts", {});
var events = getJson("vb-log", []);

// ---------------- 상태 ----------------
var device = null;        // 선택한 마이크로비트
var rxChar = null;        // 보관함 → 앱 (알림 받기)
var txChar = null;        // 앱 → 보관함 (쓰기)
var connected = false;
var connecting = false;
var wantConnected = false; // 사용자가 연결을 원함 (끊기면 자동으로 다시 연결)
var reconnectTimer = null;
var reconnectTries = 0;
var lineBuf = "";
var writeChain = Promise.resolve();   // 블루투스 쓰기는 한 번에 하나씩
var lastSeen = 0;
var boxWasOnline = false;
var currentState = "";
var pressCount = 0, okCount = 0, failCount = 0;
var lastTamper = 0;
var pingTimer = null;
var pingAt = 0;
var confirmedAt = 0;
var dbgTestAt = 0;

function $(id) { return document.getElementById(id); }
function devName() { return (device && device.name) || "micro:bit"; }
function fmt(t) {
  var d = new Date(t);
  return d.toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" }) + " " +
         d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit", second: "2-digit" });
}
function timeLabel() {
  return (Date.now() - confirmedAt < 3000 ? "✔ 확인 완료 · " : "") + fmt(Date.now());
}

// ---------------- 기록 ----------------
function renderLog() {
  var ul = $("log");
  ul.innerHTML = "";
  if (events.length === 0) { ul.innerHTML = '<li class="empty">아직 기록이 없어요.</li>'; return; }
  for (var i = events.length - 1; i >= 0; i--) {
    var li = document.createElement("li");
    var a = document.createElement("span");
    var b = document.createElement("span");
    a.textContent = events[i].text;
    b.textContent = fmt(events[i].t);
    li.appendChild(a);
    li.appendChild(b);
    ul.appendChild(li);
  }
}
function addLog(text) {
  events.push({ t: Date.now(), text: text });
  if (events.length > 80) { events = events.slice(events.length - 80); }
  setItem("vb-log", JSON.stringify(events));
  renderLog();
}

// ---------------- 화면 ----------------
function setView(state) {
  var v = VIEWS[state];
  if (!v) { return; }
  currentState = state;
  $("status").className = "status " + v.cls;
  document.body.classList.toggle("alarm", state === "alarm");
  $("icon").textContent = v.icon;
  $("state").textContent = v.text;
  $("time").textContent = timeLabel();
  $("lock").disabled = !(connected && state === "open");
  if (state !== "locked") { drawDots(0); }
}
function setOfflineView(icon, text) {
  currentState = "";
  $("status").className = "status off";
  document.body.classList.remove("alarm");
  $("icon").textContent = icon;
  $("state").textContent = text;
  $("lock").disabled = true;
}
function drawDots(n) {
  var html = "";
  for (var i = 0; i < PW_LENGTH; i++) { html += i < n ? '<b class="fill"></b>' : "<b></b>"; }
  $("dots").innerHTML = html;
  if (n > 0) {
    $("dotsTxt").textContent = "누군가 비밀번호 입력 중 · " + n + " / " + PW_LENGTH;
    $("dotsTxt").className = "dotsTxt active";
  } else {
    $("dotsTxt").textContent = "비밀번호 입력 대기";
    $("dotsTxt").className = "dotsTxt";
  }
}
function drawStats() {
  $("nPress").textContent = pressCount;
  $("nOk").textContent = okCount;
  $("nFail").textContent = failCount;
}
function setBt(cls, text) { $("btDot").className = cls; $("btTxt").textContent = text; }
function setBox(cls, text) { $("boxDot").className = cls; $("boxTxt").textContent = text; }
function updateButtons() {
  $("connect").classList.toggle("hidden", wantConnected);
  $("disconnect").classList.toggle("hidden", !wantConnected);
  $("ping").disabled = !connected;
  $("lock").disabled = !(connected && currentState === "open");
}

// ---------------- 설정 체크박스 ----------------
function drawAlertToggles() {
  var html = "";
  for (var i = 0; i < ALERT_ORDER.length; i++) {
    var id = ALERT_ORDER[i];
    var a = ALERTS[id];
    html += '<label class="tg"><input type="checkbox" data-alert="' + id + '"' + (alertOn[id] !== false ? " checked" : "") + '>' +
            '<span>' + a.em + " " + a.name + "<small>" + a.desc + "</small></span></label>";
  }
  $("alertToggles").innerHTML = html;
}
$("alertToggles").addEventListener("change", function (e) {
  var id = e.target.getAttribute("data-alert");
  if (!id) { return; }
  alertOn[id] = e.target.checked;
  setItem("vb-alerts", JSON.stringify(alertOn));
});
var optBoxes = document.querySelectorAll("[data-opt]");
for (var k = 0; k < optBoxes.length; k++) {
  if (optOn[optBoxes[k].getAttribute("data-opt")] === false) { optBoxes[k].checked = false; }
  optBoxes[k].addEventListener("change", function () {
    optOn[this.getAttribute("data-opt")] = this.checked;
    setItem("vb-opts", JSON.stringify(optOn));
    if (this.getAttribute("data-opt") === "push" && this.checked) { askNotify(); }
  });
}
function opt(name) { return optOn[name] !== false; }

// ---------------- 소리 · 말 · 진동 · 앱 밖 알림 ----------------
var audioCtx = null;
var sirenTimer = null;
function tone(freq, length) {
  if (!opt("sound")) { return; }
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = "square";
    o.frequency.value = freq;
    g.gain.value = 0.12;
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + length);
  } catch (e) {}
}
function melody(notes) {
  for (var i = 0; i < notes.length; i++) {
    (function (freq, delay) { setTimeout(function () { tone(freq, 0.14); }, delay); })(notes[i], i * 170);
  }
}
function siren(times) {
  stopSound();
  var count = 0;
  var high = true;
  tone(880, 0.25);
  sirenTimer = setInterval(function () {
    high = !high;
    tone(high ? 880 : 660, 0.25);
    count++;
    if (count >= times) { stopSound(); }
  }, 400);
}
function stopSound() {
  if (sirenTimer) { clearInterval(sirenTimer); sirenTimer = null; }
  try { window.speechSynthesis.cancel(); } catch (e) {}
}
var SOUNDS = {
  info:  function () { melody([660, 880]); },
  try:   function () { melody([520, 520]); },
  fail:  function () { melody([392, 262]); },
  ok:    function () { melody([523, 659, 784]); },
  alarm: function () { siren(24); },
  off:   function () { melody([440, 330, 262]); }
};
function speak(text) {
  if (!opt("voice") || !("speechSynthesis" in window)) { return; }
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function vibrate(pattern) {
  if (opt("vibrate") && navigator.vibrate) { navigator.vibrate(pattern); }
}
function askNotify() {
  try {
    if ("Notification" in window && Notification.permission === "default") { Notification.requestPermission(); }
  } catch (e) {}
}
function pushNotify(title, body) {
  if (!opt("push") || !document.hidden) { return; }
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") { return; }
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (reg) { reg.showNotification(title, { body: body, icon: "icon-192.png", tag: "vault-" + Date.now() }); }
      else { new Notification(title, { body: body }); }
    }).catch(function () {});
  } catch (e) {}
}

// ---------------- 화면 알림 ----------------
function showToast(a, detail) {
  var t = document.createElement("div");
  t.className = "toast c-" + a.color;
  t.innerHTML = '<div class="em"></div><div class="tx"><b></b><span></span></div>';
  t.querySelector(".em").textContent = a.em;
  t.querySelector("b").textContent = a.name;
  t.querySelector("span").textContent = detail;
  $("toasts").prepend(t);
  function close() {
    if (t.classList.contains("leave")) { return; }
    t.classList.add("leave");
    setTimeout(function () { t.remove(); }, 260);
  }
  t.addEventListener("click", close);
  setTimeout(close, TOAST_TIME);
}
function showOverlay(a, detail) {
  $("overlay").className = "overlay show" + (a.color === "off" ? " off" : "");
  $("ovEm").textContent = a.em;
  $("ovTitle").textContent = a.name;
  $("ovText").textContent = detail;
  $("ovWhen").textContent = fmt(Date.now()) + " · " + devName();
}
$("ovClose").addEventListener("click", function () {
  $("overlay").className = "overlay";
  stopSound();
});
function alertUser(id, detail) {
  if (alertOn[id] === false) { return; }
  var a = ALERTS[id];
  if (a.big) { showOverlay(a, detail); vibrate([400, 150, 400, 150, 400]); }
  else { showToast(a, detail); vibrate(150); }
  SOUNDS[a.color]();
  speak(a.name);
  pushNotify(a.em + " " + a.name, detail);
}

// ---------------- 도움말 상자 ----------------
function showHint(html, buttonText, onClick) {
  var h = $("hint");
  h.innerHTML = html;
  if (buttonText) {
    var b = document.createElement("button");
    b.textContent = buttonText;
    b.onclick = onClick;
    h.appendChild(b);
  }
  h.classList.remove("hidden");
}
function hideHint() { $("hint").classList.add("hidden"); }

// ---------------- 마이크로비트 메시지 처리 ----------------
function boxSignal() {
  lastSeen = Date.now();
  boxWasOnline = true;
  setBox("on", "보관함 신호 · 방금");
  hideHint();
  if (pingTimer) {
    clearTimeout(pingTimer);
    pingTimer = null;
    confirmedAt = Date.now();
    dbg("i", "보관함이 확인 명령에 답함 (" + (Date.now() - pingAt) + "ms)");
    $("time").textContent = timeLabel();
  }
  if (dbgTestAt) {
    dbg("i", "🧪 응답 테스트 성공: 앱 → 보관함 → 앱 " + (Date.now() - dbgTestAt) + "ms");
    dbgTestAt = 0;
  }
}

function handleLine(line) {
  line = line.replace(/\r/g, "").trim();
  if (!line) { return; }
  dbgStat.lines++;
  dbg("r", "\"" + line + "\"");
  if (line.indexOf("state:") === 0) {
    boxSignal();
    var st = line.slice(6);
    if (VIEWS[st]) { setView(st); } else { dbg("w", "모르는 상태 값: " + st); }
    return;
  }
  handleEvent(line);
}

function handleEvent(msg) {
  boxSignal();
  var parts = msg.split(":");
  var type = parts[0];
  var value = parts[1] || "";

  if (type === "alive") {
    if (VIEWS[value] && value !== currentState) { setView(value); }
  } else if (type === "press") {
    var n = parseInt(value, 10) || 0;
    pressCount++;
    drawDots(n);
    addLog("🔢 버튼 입력 " + value);
    if (n === 1) { alertUser("try", "잠긴 보관함에 비밀번호를 입력하기 시작했어요."); }
  } else if (type === "ok") {
    okCount++;
    setView("open");
    addLog("🔓 해제 성공! 보관함이 열렸어요");
    alertUser("ok", "비밀번호가 맞아서 보관함이 열렸어요.");
  } else if (type === "fail") {
    failCount++;
    drawDots(0);
    addLog("❌ 해제 실패 (연속 " + value + "회)");
    alertUser("fail", "비밀번호가 틀렸어요. (연속 " + value + "회)");
  } else if (type === "alarm") {
    setView("alarm");
    addLog("🚨 경보! 연속으로 틀려서 입력이 막혔어요");
    alertUser("alarm", "비밀번호가 연속으로 틀려서 30초 동안 입력이 막혔어요. 보관함을 확인하세요!");
  } else if (type === "tamper") {
    addLog("⚠️ 경보 중에 누군가 버튼을 또 눌렀어요");
    if (Date.now() - lastTamper > TAMPER_GAP) {
      lastTamper = Date.now();
      tone(880, 0.3);
      vibrate(300);
    }
  } else if (type === "locked") {
    setView("locked");
    addLog("🔒 잠겼어요");
  } else if (type === "setup") {
    setView("setup");
    addLog("⚙️ 비밀번호 설정 모드");
  } else if (type === "pwset") {
    addLog("🔑 비밀번호가 설정됐어요");
    alertUser("pwset", "새 비밀번호가 저장되고 보관함이 잠겼어요.");
  } else if (type === "clear") {
    drawDots(0);
    addLog("↩️ 입력하던 비밀번호를 지웠어요 (A+B)");
  } else if (type === "boot") {
    addLog("🔌 보관함이 켜졌어요");
  } else if (type === "hello") {
    dbg("i", "보관함이 인사함 (블루투스 통신 양방향 OK)");
  } else {
    dbg("w", "약속에 없는 메시지: \"" + msg + "\" — 마이크로비트 코드 버전을 확인하세요");
    addLog("📩 " + msg);
  }
  drawStats();
}

// ---------------- 블루투스 ----------------
function explainBtErr(e) {
  var n = (e && e.name) || "";
  var m = (e && e.message) || "";
  if (n === "NotFoundError" && /cancel/i.test(m)) { return " — 기기 선택 창을 닫았어요"; }
  if (n === "NotFoundError" && /service/i.test(m)) { return " — 마이크로비트에 UART 서비스가 없어요: 코드에 'bluetooth.startUartService()'가 있는지 확인"; }
  if (n === "NotFoundError") { return " — 목록에 마이크로비트가 없었어요: 마이크로비트 전원, 블루투스 코드가 들어갔는지, 다른 기기(폰·PC)가 이미 연결 중인지 확인"; }
  if (n === "SecurityError") { return " — https 주소에서 버튼을 눌러 시작해야 해요"; }
  if (n === "NotSupportedError") { return " — 이 브라우저/기기는 이 블루투스 기능을 지원하지 않아요"; }
  if (n === "NetworkError" || /GATT|disconnected|Connection/i.test(m)) {
    return " — 연결 도중 끊겼어요: 가까이 가져가서 다시 시도. 계속되면 MakeCode 프로젝트 설정에서 'No Pairing Required' 선택 후 다시 다운로드, 또는 PC/폰 블루투스 설정에서 예전에 페어링한 micro:bit 삭제";
  }
  if (n === "TimeoutError") { return " — 응답이 없어요: 마이크로비트를 리셋하고 다시 시도"; }
  return "";
}

function withTimeout(p, ms, what) {
  return Promise.race([p, new Promise(function (_, rej) {
    setTimeout(function () { var e = new Error(what + " (" + ms / 1000 + "초)"); e.name = "TimeoutError"; rej(e); }, ms);
  })]);
}

async function chooseDevice() {
  if (!navigator.bluetooth) { explainNoBluetooth(); return; }
  var dev;
  try {
    dbg("i", "기기 선택 창 열기 (이름이 'BBC micro:bit'로 시작하는 기기)");
    dev = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "BBC micro:bit" }],
      optionalServices: [UART_SERVICE]
    });
  } catch (e) {
    dbg(e.name === "NotFoundError" && /cancel/i.test(e.message) ? "w" : "e", "기기 선택 실패: " + e.name + ": " + e.message + explainBtErr(e));
    if (!(/cancel/i.test(e.message))) {
      showHint("<b>마이크로비트가 목록에 안 보이나요?</b><br>① 마이크로비트에 <b>블루투스 버전 코드</b>를 넣었나요?<br>" +
               "② 마이크로비트 전원이 켜져 있고 가까이 있나요?<br>③ 다른 폰·PC가 이미 연결해 있으면 안 보여요 (한 번에 1대만)<br>④ 이 기기의 블루투스가 켜져 있나요?");
    }
    return;
  }
  if (device && device !== dev) {
    device.removeEventListener("gattserverdisconnected", onDisconnected);
    try { if (device.gatt.connected) { device.gatt.disconnect(); } } catch (e) {}
  }
  device = dev;
  device.addEventListener("gattserverdisconnected", onDisconnected);
  dbg("i", "선택한 기기: " + devName() + " (id " + String(device.id).slice(0, 8) + "…)");
  setItem("vb-dev", devName());
  wantConnected = true;
  reconnectTries = 0;
  updateButtons();
  connectGatt();
}

async function connectGatt() {
  if (!device || connecting) { return; }
  connecting = true;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  var t0 = Date.now();
  setBt("mid", (reconnectTries ? "다시 연결 중… " : "연결 중… ") + devName());
  try {
    var server = await withTimeout(device.gatt.connect(), 12000, "블루투스 연결 시간 초과");
    dbg("i", "블루투스(GATT) 연결됨 · " + (Date.now() - t0) + "ms");
    var service;
    try {
      service = await withTimeout(server.getPrimaryService(UART_SERVICE), 8000, "UART 서비스 찾기 시간 초과");
    } catch (e) {
      dbg("e", "UART 서비스를 못 찾음 — 마이크로비트 코드에 'bluetooth.startUartService()'가 있는지 확인", e);
      throw e;
    }
    var chars = await service.getCharacteristics();
    rxChar = null; txChar = null;
    for (var i = 0; i < chars.length; i++) {
      var c = chars[i], p = c.properties;
      dbg("t", "특성 " + c.uuid.slice(0, 8) + " · notify=" + p.notify + " indicate=" + p.indicate + " write=" + p.write + " writeNoResp=" + p.writeWithoutResponse);
      if ((p.notify || p.indicate) && !rxChar) { rxChar = c; }
      else if ((p.write || p.writeWithoutResponse) && !txChar) { txChar = c; }
    }
    if (!rxChar || !txChar) { var err = new Error("UART 받기/보내기 특성을 찾지 못함"); err.name = "NotFoundError"; throw err; }
    rxChar.removeEventListener("characteristicvaluechanged", onData);
    rxChar.addEventListener("characteristicvaluechanged", onData);
    await withTimeout(rxChar.startNotifications(), 8000, "알림 켜기 시간 초과");
    dbg("i", "✅ 보관함 연결 완료 (" + (Date.now() - t0) + "ms) — 이제 신호를 기다려요");
    connected = true;
    dbgStat.connects++;
    reconnectTries = 0;
    lineBuf = "";
    writeChain = Promise.resolve();
    setBt("on", "연결됨 · " + devName());
    setOfflineView("📡", "상태 확인 중");
    addLog("🔗 " + devName() + " 와(과) 연결됐어요");
    if ($("overlay").className.indexOf(" off") >= 0) {   // "연결 끊김" 큰 화면은 다시 연결되면 닫음
      $("overlay").className = "overlay";
      stopSound();
      showToast({ em: "🔗", name: "다시 연결됐어요", color: "ok" }, devName());
    }
    updateButtons();
    connecting = false;
    askBox();
  } catch (e) {
    connecting = false;
    connected = false;
    dbg("e", "연결 실패: " + e.name + ": " + e.message + explainBtErr(e));
    try { if (device.gatt.connected) { device.gatt.disconnect(); } } catch (x) {}
    setBt("off", "연결 실패");
    updateButtons();
    if (wantConnected) { scheduleReconnect(); }
  }
}

function scheduleReconnect() {
  if (reconnectTimer || !wantConnected) { return; }
  reconnectTries++;
  dbgStat.retries++;
  var delay = Math.min(2000 * reconnectTries, 15000);
  dbg("w", Math.round(delay / 1000) + "초 뒤 다시 연결 시도 (" + reconnectTries + "번째)");
  setBt("mid", "다시 연결 대기 (" + reconnectTries + "번째)");
  reconnectTimer = setTimeout(function () { reconnectTimer = null; connectGatt(); }, delay);
}

function onDisconnected() {
  var was = connected;
  connected = false;
  rxChar = null; txChar = null;
  if (pingTimer) { clearTimeout(pingTimer); pingTimer = null; }
  updateButtons();
  if (!wantConnected) {
    dbg("i", "블루투스 연결을 끊었어요 (사용자)");
    setBt("off", "블루투스 연결 안 됨");
    return;
  }
  if (was) {
    dbgStat.drops++;
    dbg("e", "블루투스 연결이 끊김 — 거리가 멀어졌거나, 마이크로비트 전원이 꺼졌거나, 리셋됐어요");
    setBt("off", "연결 끊김");
    setBox("off", "보관함 신호 없음");
    setOfflineView("📡", "보관함 연결 끊김");
    addLog("📡 보관함 연결이 끊겼어요");
    if (boxWasOnline) {
      boxWasOnline = false;
      alertUser("offline", "블루투스 연결이 끊겼어요. 보관함을 확인하세요! 자동으로 다시 연결하고 있어요.");
    }
  }
  scheduleReconnect();
}

function onData(e) {
  var text = new TextDecoder().decode(e.target.value);
  dbg("t", "블루투스 조각 " + e.target.value.byteLength + "바이트: " + JSON.stringify(text));
  lineBuf += text;
  var parts = lineBuf.split("\n");
  lineBuf = parts.pop();
  for (var i = 0; i < parts.length; i++) { handleLine(parts[i]); }
  if (lineBuf.length > 120) {
    dbg("w", "줄바꿈 없이 긴 글자가 와요 — 마이크로비트에서 uartWriteLine 을 쓰는지 확인", lineBuf.slice(0, 60));
    handleLine(lineBuf);
    lineBuf = "";
  }
}

function send(cmd) {
  if (!connected || !txChar) {
    dbg("e", "명령 \"" + cmd + "\"을 보내지 못함 — 보관함과 연결돼 있지 않아요");
    addLog("⚠️ 보관함과 연결이 끊겨서 보내지 못했어요");
    return false;
  }
  var ch = txChar;
  var data = new TextEncoder().encode(cmd + "\n");
  dbgStat.sent++;
  dbg("i", "명령 보냄 → \"" + cmd + "\"");
  writeChain = writeChain.then(function () {
    if (ch.properties.write && ch.writeValueWithResponse) { return ch.writeValueWithResponse(data); }
    if (ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse) { return ch.writeValueWithoutResponse(data); }
    return ch.writeValue(data);
  }).then(function () {
    dbg("t", "명령 전달 완료: \"" + cmd + "\"");
  }).catch(function (e) {
    dbg("e", "명령 보내기 실패: \"" + cmd + "\" — " + e.name + ": " + e.message + explainBtErr(e));
  });
  return true;
}

function disconnectBox() {
  wantConnected = false;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  try { if (device && device.gatt.connected) { device.gatt.disconnect(); } } catch (e) {}
  connected = false;
  boxWasOnline = false;
  lastSeen = 0;
  setBt("off", "블루투스 연결 안 됨");
  setBox("", "보관함 신호 없음");
  setOfflineView("🔗", "보관함을 연결하세요");
  $("time").textContent = "";
  addLog("🔌 연결을 끊었어요");
  updateButtons();
}

function explainNoBluetooth() {
  var msg;
  if (IS_IOS) {
    msg = "<b>아이폰·아이패드의 Safari/Chrome은 웹 블루투스를 지원하지 않아요.</b><br>App Store에서 <b>Bluefy</b> 앱을 설치하고, 그 앱에서 이 주소를 열어 주세요.";
    dbg("e", "이 기기(iOS)의 브라우저는 Web Bluetooth 미지원 → Bluefy 앱 사용");
  } else if (IN_APP) {
    msg = "<b>카톡·네이버 등 앱 안의 브라우저에서는 블루투스를 쓸 수 없어요.</b><br>오른쪽 위 메뉴 → <b>다른 브라우저로 열기(Chrome)</b>를 눌러 주세요.";
    dbg("e", "앱 내장 브라우저라 Web Bluetooth 미지원 → Chrome으로 열기");
  } else if (!window.isSecureContext) {
    msg = "<b>https 주소에서만 블루투스를 쓸 수 있어요.</b>";
    dbg("e", "보안 연결(https)이 아니라 Web Bluetooth 사용 불가");
  } else {
    msg = "<b>이 브라우저는 웹 블루투스를 지원하지 않아요.</b><br>PC·안드로이드의 <b>Chrome</b> 또는 <b>Edge</b>로 열어 주세요.";
    dbg("e", "이 브라우저는 Web Bluetooth 미지원 → Chrome/Edge 사용");
  }
  showHint(msg);
}

// ---------------- 보관함 확인 ----------------
function askBox() {
  if (!send("ping")) { return; }
  pingAt = Date.now();
  $("time").textContent = "보관함에 상태를 물어보는 중…";
  if (pingTimer) { clearTimeout(pingTimer); }
  pingTimer = setTimeout(function () {
    pingTimer = null;
    if (!connected) { return; }
    if (!lastSeen) {
      dbg("e", "연결은 됐는데 보관함이 6초 동안 아무 신호도 안 보냄 — 마이크로비트 코드가 블루투스 버전(uartWriteLine)인지 확인");
      $("time").textContent = "연결은 됐지만 보관함 신호가 없어요";
      showHint("<b>블루투스는 연결됐는데 신호가 안 와요.</b><br>① 마이크로비트에 <b>이 앱용 블루투스 코드</b>(microbit/main.ts)를 넣었나요?<br>" +
               "② 마이크로비트를 리셋(뒷면 버튼)한 뒤 다시 연결해 보세요.");
    } else {
      var ago = Math.round((Date.now() - lastSeen) / 1000);
      dbg("w", "보관함이 확인 명령(ping)에 6초 동안 답하지 않음 (마지막 신호 " + ago + "초 전)");
      $("time").textContent = "확인 명령에 답이 없어요 · 마지막 신호 " + ago + "초 전";
    }
  }, 6000);
}

// 연결은 됐는데 신호가 끊기면 알림 (보관함은 5초마다 alive를 보냄)
setInterval(function () {
  if (!lastSeen || !connected) { return; }
  var gap = Date.now() - lastSeen;
  if (gap < OFFLINE_AFTER) {
    var sec = Math.round(gap / 1000);
    setBox("on", "보관함 신호 · " + (sec < 3 ? "방금" : sec + "초 전"));
    return;
  }
  setBox("off", "신호 끊김 (" + Math.round(gap / 1000) + "초)");
  if (boxWasOnline) {
    boxWasOnline = false;
    dbg("e", "블루투스는 연결돼 있는데 보관함 신호가 " + Math.round(gap / 1000) + "초 동안 없음 — 마이크로비트가 멈췄을 수 있어요");
    setOfflineView("📡", "보관함 신호 끊김");
    addLog("📡 보관함 신호가 끊겼어요");
    alertUser("offline", "보관함이 응답하지 않아요. 마이크로비트가 멈췄는지 확인하세요!");
  }
}, 2000);

// ---------------- 버튼 ----------------
$("connect").onclick = chooseDevice;
$("disconnect").onclick = disconnectBox;
$("lock").onclick = function () { if (send("lock")) { addLog("📤 잠그기 명령을 보냈어요"); } };
$("quiet").onclick = function () { stopSound(); $("overlay").className = "overlay"; };
$("ping").onclick = askBox;
$("gear").onclick = function () { $("setcard").classList.toggle("hidden"); };
$("wipe").onclick = function () { events = []; setItem("vb-log", "[]"); renderLog(); };
$("testToast").onclick = function () { alertUser("try", "미리 보기 — 잠긴 보관함에 비밀번호를 입력하기 시작했어요."); };
$("testAlarm").onclick = function () { alertUser("alarm", "미리 보기 — 비밀번호가 연속으로 틀려서 입력이 막혔어요."); };

// ---------------- 디버그 화면 ----------------
function dbgSummary() {
  var gap = lastSeen ? Math.round((Date.now() - lastSeen) / 1000) : -1;
  var v;
  if (!navigator.bluetooth) { v = '<span class="bad">이 브라우저는 블루투스 미지원</span>' + (IS_IOS ? " — Bluefy 앱 사용" : " — Chrome/Edge 사용"); }
  else if (!device) { v = '<span class="mid">아직 기기를 고르지 않았어요</span> — "보관함 연결" 버튼을 누르세요'; }
  else if (!connected) { v = '<span class="bad">블루투스 연결 안 됨</span>' + (wantConnected ? " — 자동으로 다시 연결 중" : ""); }
  else if (gap < 0) { v = '<span class="mid">연결은 됐는데 보관함 신호가 아직 없음</span> — 마이크로비트 코드 확인'; }
  else if (gap > OFFLINE_AFTER / 1000) { v = '<span class="bad">보관함 신호 끊김</span> (' + gap + '초 전 마지막)'; }
  else { v = '<span class="good">정상</span> — 보관함 신호 ' + gap + '초 전'; }
  $("dbgsum").innerHTML =
    "진단: " + v + "<br>" +
    "기기: " + esc(device ? devName() : "-") + " · 연결 " + dbgStat.connects + " / 끊김 " + dbgStat.drops + " / 재시도 " + dbgStat.retries + "<br>" +
    "받은 줄 " + dbgStat.lines + " · 보낸 명령 " + dbgStat.sent + "<br>" +
    "오류 " + dbgStat.errors + "개" + (dbgStat.lastErr ? ' · 마지막: <span class="bad">' + esc(dbgStat.lastErr.slice(0, 140)) + "</span>" : "") + "<br>" +
    "앱 켠 지 " + Math.round((Date.now() - DBG_T0) / 1000) + "초";
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
setInterval(dbgSummary, 1000);
$("dbgCopy").onclick = function () {
  var text = "== 간식금고 디버그 로그 (블루투스) ==\n" + $("dbgsum").innerText + "\n\n" +
    DBG.map(function (l) { return dbgTime(l.t) + " [" + l.l + "] " + l.m; }).join("\n");
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); showToast({ em: "📋", name: "로그 복사 완료", color: "info" }, DBG.length + "줄"); } catch (e) { alert(text); }
    ta.remove();
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () {
      showToast({ em: "📋", name: "로그 복사 완료", color: "info" }, DBG.length + "줄 — 카톡 등에 붙여넣기 하세요");
    }, fallback);
  } else { fallback(); }
};
$("dbgClear").onclick = function () { DBG = []; $("dbg").innerHTML = ""; dbg("i", "로그를 지웠어요"); };
$("dbgTest").onclick = function () {
  if (!connected) { dbg("e", "🧪 응답 테스트 불가: 보관함과 연결돼 있지 않아요"); return; }
  dbgTestAt = Date.now();
  dbg("i", "🧪 응답 테스트 시작 (ping 보내고 답 기다림)");
  send("ping");
  setTimeout(function () {
    if (dbgTestAt) { dbg("e", "🧪 응답 테스트 실패: 5초 안에 답이 없어요 — 마이크로비트가 명령을 못 받거나 코드가 다른 버전"); dbgTestAt = 0; }
  }, 5000);
};

// ---------------- 화면 켜 두기 · 첫 터치 ----------------
function keepAwake() {
  try {
    if (navigator.wakeLock) {
      navigator.wakeLock.request("screen").catch(function (e) { dbg("t", "화면 꺼짐 방지 실패 (무시해도 됨): " + e.message); });
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") { keepAwake(); }
});
document.addEventListener("pointerdown", function () {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
  } catch (e) {}
  if (opt("push")) { askNotify(); }
  keepAwake();
}, { once: true });

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(function (reg) {
    dbg("t", "서비스워커 등록됨 · scope=" + reg.scope);
  }).catch(function (e) { dbg("w", "서비스워커 등록 실패 (오프라인 실행만 안 됨)", e); });
}

// ---------------- 시작 ----------------
drawAlertToggles();
drawDots(0);
drawStats();
renderLog();
updateButtons();
if (!navigator.bluetooth) {
  explainNoBluetooth();
  $("connect").disabled = true;
} else {
  if (navigator.bluetooth.getAvailability) {
    navigator.bluetooth.getAvailability().then(function (ok) {
      dbg(ok ? "t" : "e", ok ? "이 기기에 블루투스 있음" : "이 기기의 블루투스가 꺼져 있거나 없어요 — 블루투스를 켜 주세요");
    }).catch(function () {});
  }
  // 예전에 허락한 기기가 있으면 자동으로 다시 연결 시도 (지원하는 브라우저만)
  if (navigator.bluetooth.getDevices) {
    navigator.bluetooth.getDevices().then(function (list) {
      var saved = getItem("vb-dev", "");
      var found = null;
      for (var i = 0; i < list.length; i++) { if (list[i].name === saved) { found = list[i]; } }
      dbg("t", "예전에 허락한 기기 " + list.length + "개" + (found ? " · '" + saved + "' 자동 연결 시도" : ""));
      if (found) {
        device = found;
        device.addEventListener("gattserverdisconnected", onDisconnected);
        wantConnected = true;
        updateButtons();
        connectGatt();
      }
    }).catch(function (e) { dbg("t", "저장된 기기 확인 실패 (무시해도 됨)", e); });
  }
}
</script>
