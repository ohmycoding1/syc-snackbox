<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a49">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>도난 방지 간식 보관함</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1b2a49; --bg2: #243660; --fg: #fff8e7; --muted: #a9b7d6; --panel: #2b3f70; --line: #46609c;
  --yellow: #ffc93c; --mint: #5eead4; --alarm: #ff4d5e; --alarm-bg: #4a1626; --green: #4ade80;
}
* { box-sizing: border-box; }
html { height: 100%; background: #1b2a49; }
body {
  margin: 0; min-height: 100%;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  background: radial-gradient(circle at 50% -10%, var(--bg2), var(--bg) 60%) fixed;
  color: var(--fg); font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  display: flex; justify-content: center;
}
body.alarm { background: radial-gradient(circle at 50% 30%, #7a1f33, var(--alarm-bg) 65%) fixed; }
main { width: 100%; max-width: 460px; padding: 18px 18px 44px; }
.snacks { text-align: center; font-size: 24px; letter-spacing: 6px; }
h1 { font-size: 28px; margin: 4px 0 6px; text-align: center; color: var(--yellow); text-shadow: 0 3px 0 #0006; }

/* 연결 상태 줄 */
.conn { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.conn span { display: inline-flex; align-items: center; gap: 6px; }
.conn i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #888; }
.conn i.on { background: var(--mint); box-shadow: 0 0 0 4px #5eead433; }
.conn i.mid { background: var(--yellow); }
.conn i.off { background: var(--alarm); }

/* 금고 */
.status { text-align: center; padding: 4px 0 4px; }
.vault {
  width: 210px; height: 210px; margin: 0 auto; border-radius: 50%; padding: 14px;
  background: conic-gradient(#8c99b8, #dfe6f5, #8c99b8, #dfe6f5, #8c99b8); box-shadow: 0 10px 0 #0005;
}
.door {
  width: 100%; height: 100%; border-radius: 50%; border: 6px solid #1b2a49;
  background: radial-gradient(circle at 35% 30%, #4a5f93, #2b3f70);
  display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 6px var(--mint);
  transition: box-shadow .3s, background .3s;
}
.icon { font-size: 68px; line-height: 1; }
.status.alarm .door { box-shadow: inset 0 0 0 6px var(--alarm); background: radial-gradient(circle at 35% 30%, #a8283c, #5a1427); }
.status.alarm .vault { animation: shake .4s 4, glow 1s infinite; }
.status.open .door { box-shadow: inset 0 0 0 6px var(--yellow); }
.status.setup .door { box-shadow: inset 0 0 0 6px #c4b5fd; }
.status.off .door { box-shadow: inset 0 0 0 6px var(--line); }
.state { font-size: 28px; margin: 16px 0 2px; color: var(--mint); }
.status.alarm .state { color: #ff8a96; }
.status.open .state { color: var(--yellow); }
.status.setup .state { color: #c4b5fd; }
.status.off .state { color: var(--muted); }
.time { color: var(--muted); font-size: 15px; min-height: 20px; }

/* 비밀번호 입력 진행 */
.dots { display: flex; justify-content: center; gap: 12px; margin: 14px 0 4px; }
.dots b { width: 18px; height: 18px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); transition: all .15s; }
.dots b.fill { background: var(--yellow); border-color: var(--yellow); transform: scale(1.2); box-shadow: 0 0 12px #ffc93c88; }
.dotsTxt { text-align: center; font-size: 14px; color: var(--muted); min-height: 20px; }
.dotsTxt.active { color: var(--yellow); }

/* 숫자 */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.stat { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px 8px; text-align: center; }
.stat b { display: block; font-size: 26px; font-weight: normal; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.ok b { color: var(--green); }
.stat.bad b { color: #ff8a96; }

/* 버튼 */
.row { display: flex; gap: 10px; margin-top: 14px; }
button {
  font: inherit; font-size: 17px; border: 0; border-radius: 16px; padding: 14px 8px; cursor: pointer; flex: 1;
  background: var(--yellow); color: #1b2a49; box-shadow: 0 5px 0 #b88a00;
}
button:active { transform: translateY(4px); box-shadow: 0 1px 0 #b88a00; }
button.ghost { background: var(--panel); color: var(--fg); box-shadow: 0 5px 0 #14213d; }
button.ghost:active { box-shadow: 0 1px 0 #14213d; }
button:disabled { opacity: .45; cursor: default; transform: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

/* 카드 */
.card { background: var(--panel); border-radius: 20px; padding: 4px 16px 16px; margin-top: 20px; border: 2px solid var(--line); }
h2 { font-size: 19px; margin: 16px 0 6px; color: var(--yellow); font-weight: normal; }
h3 { font-size: 15px; margin: 16px 0 4px; color: var(--muted); font-weight: normal; }
label.f { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
input[type=text] { width: 100%; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--fg); }
.tg { display: flex; align-items: center; gap: 10px; padding: 8px 4px; font-size: 16px; cursor: pointer; }
.tg input { width: 20px; height: 20px; accent-color: var(--yellow); flex: none; }
.tg small { display: block; font-size: 12px; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; background: var(--bg); border-radius: 14px; max-height: 320px; overflow-y: auto; }
li { padding: 11px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
li:last-child { border-bottom: 0; }
li.empty { color: var(--muted); }
li span:last-child { color: var(--muted); font-size: 13px; white-space: nowrap; }
.hidden { display: none; }
.hint {
  margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: #ffc93c22; border: 2px solid var(--yellow);
  font-size: 15px; line-height: 1.5; color: var(--fg);
}
.hint b { color: var(--yellow); font-weight: normal; }
.hint button { margin-top: 10px; width: 100%; }
.diag { font-size: 13px; color: var(--muted); line-height: 1.7; }
.diag code { color: var(--mint); font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
.raw li { font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding: 8px 12px; }
.raw li span:first-child { word-break: break-all; }
.note { font-size: 13px; color: var(--muted); margin-top: 18px; line-height: 1.6; text-align: center; }

/* 화면 위 작은 알림 */
.toasts {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: min(430px, calc(100vw - 24px)); z-index: 50; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  pointer-events: auto; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 18px;
  background: #fff8e7; color: #1b2a49; box-shadow: 0 6px 0 #0005; border: 3px solid var(--mint);
  animation: drop .25s ease-out;
}
.toast.leave { animation: rise .25s ease-in forwards; }
.toast .em { font-size: 30px; line-height: 1; flex: none; }
.toast .tx { flex: 1; min-width: 0; }
.toast b { display: block; font-size: 18px; font-weight: normal; }
.toast span { display: block; font-size: 13px; color: #4a5a80; margin-top: 2px; }
.toast.c-try { border-color: var(--yellow); }
.toast.c-fail { border-color: var(--alarm); }
.toast.c-ok { border-color: var(--green); }
.toast.c-info { border-color: #c4b5fd; }
.toast:nth-child(n+3) { display: none; }
@keyframes drop { from { transform: translateY(-30px); opacity: 0; } }
@keyframes rise { to { transform: translateY(-30px); opacity: 0; } }

/* 큰 경보 화면 */
.overlay {
  position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 24px;
  background: radial-gradient(circle at 50% 35%, #a8283c, #3a0f1d 70%);
}
.overlay.show { display: flex; animation: pulse 1s ease-in-out infinite alternate; }
.overlay .box { text-align: center; max-width: 380px; }
.overlay .em { font-size: 96px; line-height: 1; animation: shake .4s infinite; display: inline-block; }
.overlay h2 { font-size: 34px; color: #fff; margin: 18px 0 8px; text-shadow: 0 3px 0 #0006; }
.overlay p { font-size: 18px; margin: 0 0 6px; color: #ffd9dd; line-height: 1.5; }
.overlay .when { font-size: 14px; color: #ffb3bb; margin-bottom: 26px; }
.overlay button { background: #fff8e7; color: #a8283c; box-shadow: 0 5px 0 #0007; font-size: 20px; padding: 16px 36px; flex: none; }
.overlay.off { background: radial-gradient(circle at 50% 35%, #46609c, #141f38 70%); }
.overlay.off .em { animation: none; }
.overlay.off button { color: #1b2a49; }

@keyframes shake { 25% { transform: translateX(-8px) rotate(-2deg); } 75% { transform: translateX(8px) rotate(2deg); } }
@keyframes glow { 50% { box-shadow: 0 10px 0 #0005, 0 0 40px 12px #ff4d5e99; } }
@keyframes pulse { to { filter: brightness(1.25); } }
@media (prefers-reduced-motion: reduce) {
  .status.alarm .vault, .overlay .em, .overlay.show { animation: none; }
}
</style>
</head>
<body>
<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="overlay" id="overlay" role="alertdialog" aria-labelledby="ovTitle">
  <div class="box">
    <div class="em" id="ovEm">🚨</div>
    <h2 id="ovTitle">경보!</h2>
    <p id="ovText"></p>
    <div class="when" id="ovWhen"></div>
    <button id="ovClose">확인했어요</button>
  </div>
</div>

<main>
  <div class="snacks" aria-hidden="true">🍪🍫🍬🍩</div>
  <h1>도난 방지 간식 보관함</h1>
  <div class="conn">
    <span><i id="netDot"></i><span id="netTxt">서버 연결 중…</span></span>
    <span><i id="boxDot"></i><span id="boxTxt">보관함 신호 없음</span></span>
  </div>

  <section class="status off" id="status" aria-live="assertive">
    <div class="vault"><div class="door"><div class="icon" id="icon">📡</div></div></div>
    <div class="state" id="state">상태 확인 중</div>
    <div class="time" id="time"></div>
  </section>

  <div class="hint hidden" id="hint"></div>

  <div class="dots" id="dots"></div>
  <div class="dotsTxt" id="dotsTxt"></div>

  <div class="stats">
    <div class="stat"><b id="nPress">0</b><span>버튼 입력</span></div>
    <div class="stat ok"><b id="nOk">0</b><span>해제 성공</span></div>
    <div class="stat bad"><b id="nFail">0</b><span>해제 실패</span></div>
  </div>

  <div class="row">
    <button id="lock" disabled>🔒 잠그기</button>
    <button class="ghost" id="quiet">🔕 소리 끄기</button>
  </div>
  <div class="row">
    <button class="ghost" id="ping">📡 보관함 확인</button>
    <button class="ghost" id="gear" aria-label="설정" style="flex:0 0 56px">⚙️</button>
  </div>

  <div class="card hidden" id="setcard">
    <h2>설정</h2>
    <label class="f" for="did">보관함 ID (마이크로비트 코드의 BOX_ID와 같게)</label>
    <input type="text" id="did" autocomplete="off">
    <label class="f" for="url">MQTT 서버 주소</label>
    <input type="text" id="url" autocomplete="off">
    <div class="row"><button id="save">저장하고 다시 연결</button></div>

    <h3>어떤 일이 생기면 알려 줄까요?</h3>
    <div id="alertToggles"></div>

    <h3>어떻게 알려 줄까요?</h3>
    <label class="tg"><input type="checkbox" data-opt="sound" checked><span>🔊 소리<small>경보는 사이렌처럼 크게</small></span></label>
    <label class="tg"><input type="checkbox" data-opt="voice" checked><span>🗣️ 말로 읽어 주기<small>"해제에 실패했어요"처럼 읽어 줘요</small></span></label>
    <label class="tg"><input type="checkbox" data-opt="vibrate" checked><span>📳 진동<small>진동이 되는 휴대폰에서만</small></span></label>
    <label class="tg"><input type="checkbox" data-opt="push" checked><span>🔔 앱 밖 알림<small>다른 화면을 보고 있을 때 알림 (처음에 허용 필요)</small></span></label>
    <h3>통신 확인</h3>
    <div class="diag" id="diag"></div>
    <ul class="raw" id="raw"><li class="empty">아직 받은 신호가 없어요.</li></ul>

    <div class="row">
      <button class="ghost" id="testToast">알림 미리 보기</button>
      <button class="ghost" id="testAlarm">경보 미리 보기</button>
    </div>
  </div>

  <div class="card">
    <h2>기록</h2>
    <ul id="log"><li class="empty">아직 기록이 없어요.</li></ul>
    <div class="row"><button class="ghost" id="wipe">기록 지우기</button></div>
  </div>

  <p class="note">앱을 열어 둔 동안 보관함 신호를 실시간으로 받아요.<br>처음 한 번 화면을 터치해야 소리가 나요.</p>
</main>

<script src="mqtt.min.js"></script>
<script>
// =====================================================================
//  마이크로비트(BOX)와 주고받는 약속
//   dlabbox/<ID>/event : boot, setup, pwset, locked, press:2/4, ok, fail:1,
//                        alarm, tamper, clear, alive:locked (10초마다)
//   dlabbox/<ID>/state : setup / locked / open / alarm  (마지막 값이 서버에 저장됨)
//   dlabbox/<ID>/cmd   : lock(열려 있을 때 잠그기), ping(상태 다시 보내기)
// =====================================================================
var PW_LENGTH = 4;            // 마이크로비트의 PW_LENGTH와 같게
var OFFLINE_AFTER = 35000;    // 이 시간 동안 신호가 없으면 "신호 끊김" (보관함은 10초마다 신호)
var TOAST_TIME = 6000;        // 작은 알림이 떠 있는 시간(ms)
var TAMPER_GAP = 60000;       // 경보 중 버튼 알림은 1분에 한 번만
var DEFAULT_ID = "dlab-box-01";
var DEFAULT_URL = "wss://broker.emqx.io:8084/mqtt";

// 알림 종류: 그림, 제목, 설명, 색, 큰 화면 여부
var ALERTS = {
  pwset:   { em: "🔑", name: "비밀번호를 설정했어요",  desc: "새 비밀번호를 저장했을 때",          color: "info", big: false },
  try:     { em: "👆", name: "누군가 해제를 시도해요", desc: "잠긴 보관함 버튼을 처음 눌렀을 때",   color: "try",  big: false },
  fail:    { em: "❌", name: "해제에 실패했어요",      desc: "비밀번호가 틀렸을 때",              color: "fail", big: false },
  ok:      { em: "🔓", name: "해제에 성공했어요",      desc: "비밀번호가 맞아서 열렸을 때",        color: "ok",   big: false },
  alarm:   { em: "🚨", name: "경보가 울렸어요",        desc: "연속으로 틀려서 입력이 막혔을 때",    color: "alarm", big: true },
  offline: { em: "📡", name: "보관함 신호가 끊겼어요",  desc: "전원이 빠지거나 와이파이가 끊겼을 때", color: "off",  big: true }
};
var ALERT_ORDER = ["pwset", "try", "fail", "ok", "alarm", "offline"];

// 보관함 상태별 화면
var VIEWS = {
  locked: { cls: "",      icon: "🔒", text: "잠겨 있어요" },
  open:   { cls: "open",  icon: "🍪", text: "보관함이 열렸어요" },
  setup:  { cls: "setup", icon: "🔑", text: "비밀번호 설정 중" },
  alarm:  { cls: "alarm", icon: "🚨", text: "경보! 입력 차단 중" }
};

// ---------------- 저장소 ----------------
function getItem(key, fallback) {
  try {
    var v = localStorage.getItem(key);
    if (v === null) { return fallback; }
    return v;
  } catch (e) { return fallback; }
}
function setItem(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function getJson(key, fallback) {
  try { return JSON.parse(getItem(key, "")) || fallback; } catch (e) { return fallback; }
}

var cfg = { id: getItem("vb-id", DEFAULT_ID), url: getItem("vb-url", DEFAULT_URL) };
var alertOn = getJson("vb-alerts", {});
var optOn = getJson("vb-opts", {});
var events = getJson("vb-log", []);

var client = null;
var lastSeen = 0;
var boxWasOnline = false;
var currentState = "";
var pressCount = 0, okCount = 0, failCount = 0;
var lastTamper = 0;
var pingTimer = null;
var pingAt = 0;
var confirmedAt = 0;
// 상태 아래 시간 글자 (방금 '보관함 확인'에 답이 왔으면 표시)
function timeLabel() {
  var mark = Date.now() - confirmedAt < 3000 ? "✔ 확인 완료 · " : "";
  return mark + fmt(Date.now());
}
var rawCount = 0;
var rawList = [];
var otherIds = {};   // 다른 ID로 들어오는 보관함 신호 (ID가 다를 때 찾아 주려고)

function $(id) { return document.getElementById(id); }
function topic(name) { return "dlabbox/" + cfg.id + "/" + name; }
function fmt(t) {
  var d = new Date(t);
  return d.toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" }) + " " +
         d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit", second: "2-digit" });
}

// ---------------- 기록 ----------------
function renderLog() {
  var ul = $("log");
  ul.innerHTML = "";
  if (events.length === 0) {
    ul.innerHTML = '<li class="empty">아직 기록이 없어요.</li>';
    return;
  }
  for (var i = events.length - 1; i >= 0; i--) {
    var li = document.createElement("li");
    var a = document.createElement("span");
    var b = document.createElement("span");
    a.textContent = events[i].text;
    b.textContent = fmt(events[i].t);
    li.appendChild(a);
    li.appendChild(b);
    ul.appendChild(li);
  }
}
function addLog(text) {
  events.push({ t: Date.now(), text: text });
  if (events.length > 80) { events = events.slice(events.length - 80); }
  setItem("vb-log", JSON.stringify(events));
  renderLog();
}

// ---------------- 화면 ----------------
function setView(state) {
  var v = VIEWS[state];
  if (!v) { return; }
  currentState = state;
  $("status").className = "status " + v.cls;
  document.body.classList.toggle("alarm", state === "alarm");
  $("icon").textContent = v.icon;
  $("state").textContent = v.text;
  $("time").textContent = timeLabel();
  $("lock").disabled = state !== "open";
  if (state !== "locked") { drawDots(0); }
}
function setOfflineView(text) {
  $("status").className = "status off";
  document.body.classList.remove("alarm");
  $("icon").textContent = "📡";
  $("state").textContent = text;
  $("lock").disabled = true;
}
function drawDots(n) {
  var html = "";
  for (var i = 0; i < PW_LENGTH; i++) {
    html += i < n ? '<b class="fill"></b>' : "<b></b>";
  }
  $("dots").innerHTML = html;
  if (n > 0) {
    $("dotsTxt").textContent = "누군가 비밀번호 입력 중 · " + n + " / " + PW_LENGTH;
    $("dotsTxt").className = "dotsTxt active";
  } else {
    $("dotsTxt").textContent = "비밀번호 입력 대기";
    $("dotsTxt").className = "dotsTxt";
  }
}
function drawStats() {
  $("nPress").textContent = pressCount;
  $("nOk").textContent = okCount;
  $("nFail").textContent = failCount;
}
function setNet(cls, text) { $("netDot").className = cls; $("netTxt").textContent = text; }
function setBox(cls, text) { $("boxDot").className = cls; $("boxTxt").textContent = text; }

// ---------------- 설정 체크박스 ----------------
function drawAlertToggles() {
  var html = "";
  for (var i = 0; i < ALERT_ORDER.length; i++) {
    var id = ALERT_ORDER[i];
    var a = ALERTS[id];
    var checked = alertOn[id] !== false;
    html += '<label class="tg"><input type="checkbox" data-alert="' + id + '"' + (checked ? " checked" : "") + '>' +
            '<span>' + a.em + " " + a.name + "<small>" + a.desc + "</small></span></label>";
  }
  $("alertToggles").innerHTML = html;
}
$("alertToggles").addEventListener("change", function (e) {
  var id = e.target.getAttribute("data-alert");
  if (!id) { return; }
  alertOn[id] = e.target.checked;
  setItem("vb-alerts", JSON.stringify(alertOn));
});
var optBoxes = document.querySelectorAll("[data-opt]");
for (var k = 0; k < optBoxes.length; k++) {
  var box = optBoxes[k];
  var name = box.getAttribute("data-opt");
  if (optOn[name] === false) { box.checked = false; }
  box.addEventListener("change", function () {
    optOn[this.getAttribute("data-opt")] = this.checked;
    setItem("vb-opts", JSON.stringify(optOn));
    if (this.getAttribute("data-opt") === "push" && this.checked) { askNotify(); }
  });
}
function opt(name) { return optOn[name] !== false; }

// ---------------- 소리 · 말 · 진동 · 앱 밖 알림 ----------------
var audioCtx = null;
var sirenTimer = null;
function tone(freq, length) {
  if (!opt("sound")) { return; }
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = "square";
    o.frequency.value = freq;
    g.gain.value = 0.12;
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + length);
  } catch (e) {}
}
function melody(notes) {
  for (var i = 0; i < notes.length; i++) {
    (function (freq, delay) {
      setTimeout(function () { tone(freq, 0.14); }, delay);
    })(notes[i], i * 170);
  }
}
function siren(times) {
  stopSound();
  var count = 0;
  var high = true;
  tone(880, 0.25);
  sirenTimer = setInterval(function () {
    high = !high;
    tone(high ? 880 : 660, 0.25);
    count++;
    if (count >= times) { stopSound(); }
  }, 400);
}
function stopSound() {
  if (sirenTimer) { clearInterval(sirenTimer); sirenTimer = null; }
  try { window.speechSynthesis.cancel(); } catch (e) {}
}
var SOUNDS = {
  info:  function () { melody([660, 880]); },
  try:   function () { melody([520, 520]); },
  fail:  function () { melody([392, 262]); },
  ok:    function () { melody([523, 659, 784]); },
  alarm: function () { siren(24); },
  off:   function () { melody([440, 330, 262]); }
};
function speak(text) {
  if (!opt("voice") || !("speechSynthesis" in window)) { return; }
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR";
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function vibrate(pattern) {
  if (opt("vibrate") && navigator.vibrate) { navigator.vibrate(pattern); }
}
function askNotify() {
  try {
    if ("Notification" in window && Notification.permission === "default") { Notification.requestPermission(); }
  } catch (e) {}
}
function pushNotify(title, body) {
  if (!opt("push") || !document.hidden) { return; }   // 앱을 보고 있으면 화면 알림으로 충분
  try {
    if (!("Notification" in window) || Notification.permission !== "granted") { return; }
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (reg) {
        reg.showNotification(title, { body: body, icon: "icon-192.png", tag: "vault-" + Date.now() });
      } else {
        new Notification(title, { body: body });
      }
    });
  } catch (e) {}
}

// ---------------- 화면 알림 ----------------
function showToast(a, detail) {
  var t = document.createElement("div");
  t.className = "toast c-" + a.color;
  t.innerHTML = '<div class="em"></div><div class="tx"><b></b><span></span></div>';
  t.querySelector(".em").textContent = a.em;
  t.querySelector("b").textContent = a.name;
  t.querySelector("span").textContent = detail;
  $("toasts").prepend(t);
  function close() {
    if (t.classList.contains("leave")) { return; }
    t.classList.add("leave");
    setTimeout(function () { t.remove(); }, 260);
  }
  t.addEventListener("click", close);
  setTimeout(close, TOAST_TIME);
}
function showOverlay(a, detail) {
  $("overlay").className = "overlay show" + (a.color === "off" ? " off" : "");
  $("ovEm").textContent = a.em;
  $("ovTitle").textContent = a.name;
  $("ovText").textContent = detail;
  $("ovWhen").textContent = fmt(Date.now()) + " · " + cfg.id;
}
$("ovClose").addEventListener("click", function () {
  $("overlay").className = "overlay";
  stopSound();
});

// 알림 하나 보내기 (종류 + 자세한 설명)
function alertUser(id, detail) {
  if (alertOn[id] === false) { return; }
  var a = ALERTS[id];
  if (a.big) {
    showOverlay(a, detail);
    vibrate([400, 150, 400, 150, 400]);
  } else {
    showToast(a, detail);
    vibrate(150);
  }
  SOUNDS[a.color]();
  speak(a.name);
  pushNotify(a.em + " " + a.name, detail);
}

// ---------------- 마이크로비트 메시지 처리 ----------------
function boxSignal() {
  lastSeen = Date.now();
  boxWasOnline = true;
  setBox("on", "보관함 온라인 · 방금 신호");
  hideHint();
  if (pingTimer) {
    clearTimeout(pingTimer);
    pingTimer = null;
    confirmedAt = Date.now();
    $("time").textContent = timeLabel();
  }
}

// ---------------- 도움말 상자 ----------------
function showHint(html, buttonText, onClick) {
  var h = $("hint");
  h.innerHTML = html;
  if (buttonText) {
    var b = document.createElement("button");
    b.textContent = buttonText;
    b.onclick = onClick;
    h.appendChild(b);
  }
  h.classList.remove("hidden");
}
function hideHint() { $("hint").classList.add("hidden"); }

// ---------------- 통신 확인 (설정 안) ----------------
function addRaw(t, msg) {
  rawCount++;
  rawList.push({ t: Date.now(), text: t.replace("dlabbox/", "") + "  →  " + msg });
  if (rawList.length > 12) { rawList.shift(); }
  drawDiag();
}
function drawDiag() {
  var others = Object.keys(otherIds);
  var html = "서버: <code>" + cfg.url + "</code><br>" +
             "듣고 있는 주제: <code>" + topic("event") + "</code>, <code>" + topic("state") + "</code><br>" +
             "명령 보내는 주제: <code>" + topic("cmd") + "</code><br>" +
             "받은 신호: " + rawCount + "개" +
             (lastSeen ? " · 마지막 " + Math.round((Date.now() - lastSeen) / 1000) + "초 전" : "");
  if (others.length > 0) {
    html += "<br>다른 ID로 오는 신호: <code>" + others.join(", ") + "</code>";
  }
  $("diag").innerHTML = html;
  var ul = $("raw");
  ul.innerHTML = "";
  if (rawList.length === 0) {
    ul.innerHTML = '<li class="empty">아직 받은 신호가 없어요.</li>';
    return;
  }
  for (var i = rawList.length - 1; i >= 0; i--) {
    var li = document.createElement("li");
    var a = document.createElement("span");
    var b = document.createElement("span");
    a.textContent = rawList[i].text;
    b.textContent = new Date(rawList[i].t).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit", second: "2-digit" });
    li.appendChild(a);
    li.appendChild(b);
    ul.appendChild(li);
  }
}

// 다른 ID의 보관함 신호가 오면 알려 주기
function foundOtherId(id) {
  var isNew = !otherIds[id];
  otherIds[id] = Date.now();
  drawDiag();
  if (isNew && Date.now() - lastSeen > 20000) {
    showHint("<b>'" + id + "'</b> 보관함의 신호가 와요.<br>지금 앱은 <b>'" + cfg.id + "'</b>을(를) 보고 있어서 화면에 안 나와요. 마이크로비트 코드의 BOX_ID가 '" + id + "'인가요?",
      "'" + id + "' 보관함으로 바꾸기", function () { changeId(id); });
  }
}
function changeId(id) {
  cfg.id = id;
  setItem("vb-id", id);
  $("did").value = id;
  hideHint();
  pressCount = 0; okCount = 0; failCount = 0;
  drawStats();
  addLog("⚙️ '" + id + "' 보관함에 다시 연결해요");
  connect();
}

// state 주제: 화면만 바꿈 (소리 없음 — 접속하자마자 오는 저장된 값도 이걸로 받음)
function handleState(msg) {
  if (VIEWS[msg]) { setView(msg); }
}

// event 주제: 기록 + 알림
function handleEvent(msg) {
  boxSignal();
  var parts = msg.split(":");
  var type = parts[0];
  var value = parts[1] || "";

  if (type === "alive") {
    if (VIEWS[value] && value !== currentState) { setView(value); }
  } else if (type === "press") {
    var n = parseInt(value, 10) || 0;
    pressCount++;
    drawDots(n);
    addLog("🔢 버튼 입력 " + value);
    if (n === 1) { alertUser("try", "잠긴 보관함에 비밀번호를 입력하기 시작했어요."); }
  } else if (type === "ok") {
    okCount++;
    setView("open");
    addLog("🔓 해제 성공! 보관함이 열렸어요");
    alertUser("ok", "비밀번호가 맞아서 보관함이 열렸어요.");
  } else if (type === "fail") {
    failCount++;
    drawDots(0);
    addLog("❌ 해제 실패 (연속 " + value + "회)");
    alertUser("fail", "비밀번호가 틀렸어요. (연속 " + value + "회)");
  } else if (type === "alarm") {
    setView("alarm");
    addLog("🚨 경보! 연속으로 틀려서 입력이 막혔어요");
    alertUser("alarm", "비밀번호가 연속으로 틀려서 30초 동안 입력이 막혔어요. 보관함을 확인하세요!");
  } else if (type === "tamper") {
    addLog("⚠️ 경보 중에 누군가 버튼을 또 눌렀어요");
    if (Date.now() - lastTamper > TAMPER_GAP) {
      lastTamper = Date.now();
      tone(880, 0.3);
      vibrate(300);
    }
  } else if (type === "locked") {
    setView("locked");
    addLog("🔒 잠겼어요");
  } else if (type === "setup") {
    setView("setup");
    addLog("⚙️ 비밀번호 설정 모드");
  } else if (type === "pwset") {
    addLog("🔑 비밀번호가 설정됐어요");
    alertUser("pwset", "새 비밀번호가 저장되고 보관함이 잠겼어요.");
  } else if (type === "clear") {
    drawDots(0);
    addLog("↩️ 입력하던 비밀번호를 지웠어요 (A+B)");
  } else if (type === "boot") {
    addLog("🔌 보관함이 켜졌어요");
  } else {
    addLog("📩 " + msg);
  }
  drawStats();
}

// ---------------- MQTT 연결 ----------------
function connect() {
  if (client) { client.end(true); }
  lastSeen = 0;
  boxWasOnline = false;
  currentState = "";
  rawCount = 0;
  rawList = [];
  otherIds = {};
  hideHint();
  drawDiag();
  setNet("mid", "서버 연결 중…");
  setBox("", "보관함 신호 없음");
  setOfflineView("상태 확인 중");
  $("time").textContent = "";

  client = mqtt.connect(cfg.url, {
    clientId: "pwa-" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000,
    connectTimeout: 8000,
    clean: true
  });
  client.on("connect", function () {
    setNet("on", "서버 연결됨");
    // 모든 보관함의 event를 듣고(ID가 달라도 찾아 주려고), 내 보관함 state를 들음
    client.subscribe(["dlabbox/+/event", topic("state")]);
    askBox();
  });
  client.on("reconnect", function () { setNet("mid", "다시 연결 중…"); });
  client.on("offline", function () { setNet("off", "서버 연결 끊김"); });
  client.on("error", function () { setNet("off", "서버 연결 오류"); });
  client.on("message", function (t, payload) {
    var msg = payload.toString().trim();
    if (t === topic("state")) {
      addRaw(t, msg);
      handleState(msg);
    } else if (t === topic("event")) {
      addRaw(t, msg);
      handleEvent(msg);
    } else {
      var other = t.split("/")[1];
      if (other) { foundOtherId(other); }
    }
  });
}

function send(cmd) {
  if (client && client.connected) {
    client.publish(topic("cmd"), cmd);
    return true;
  }
  addLog("⚠️ 서버 연결이 끊겨서 보내지 못했어요");
  return false;
}

// 보관함이 살아있는지 2초마다 확인
setInterval(function () {
  if (!lastSeen) { return; }
  var gap = Date.now() - lastSeen;
  if (gap < OFFLINE_AFTER) {
    var sec = Math.round(gap / 1000);
    setBox("on", "보관함 온라인 · " + (sec < 3 ? "방금" : sec + "초 전") + " 신호");
    drawDiag();
    return;
  }
  setBox("off", "신호 끊김 (마지막 " + new Date(lastSeen).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" }) + ")");
  if (boxWasOnline) {
    boxWasOnline = false;
    setOfflineView("보관함 신호 끊김");
    addLog("📡 보관함 신호가 끊겼어요");
    alertUser("offline", "전원이 빠졌거나 와이파이가 끊겼을 수 있어요. 보관함을 확인하세요!");
  }
}, 2000);

// ---------------- 버튼 ----------------
$("lock").onclick = function () {
  if (send("lock")) { addLog("📤 잠그기 명령을 보냈어요"); }
};
$("quiet").onclick = function () {
  stopSound();
  $("overlay").className = "overlay";
};
// 보관함에 상태를 물어보고, 8초 안에 답이 없으면 이유를 알려 줌
function askBox() {
  if (!send("ping")) { return; }
  pingAt = Date.now();
  $("time").textContent = "보관함에 상태를 물어보는 중…";
  if (pingTimer) { clearTimeout(pingTimer); }
  pingTimer = setTimeout(function () {
    pingTimer = null;
    if (!lastSeen) {
      $("time").textContent = "보관함에서 아직 신호가 한 번도 안 왔어요";
      showHint("<b>확인해 보세요</b><br>① 마이크로비트 LED에 😊가 떴나요? (😕면 와이파이 연결 실패)<br>" +
               "② 마이크로비트 코드의 BOX_ID와 ⚙️ 설정의 보관함 ID가 똑같나요? (지금: '" + cfg.id + "')<br>" +
               "③ 마이크로비트가 켜진 지 10초 넘게 지났나요? 10초마다 신호를 보내요.");
    } else {
      var ago = Math.round((Date.now() - lastSeen) / 1000);
      $("time").textContent = "확인 명령에 답이 없어요 · 마지막 신호 " + ago + "초 전";
      showHint("보관함 신호는 오고 있지만 <b>확인 명령</b>에는 답하지 않았어요.<br>" +
               "마이크로비트 코드를 최신 버전으로 다시 넣어 주세요. 그래도 상태는 10초마다 자동으로 바뀌어요.");
    }
  }, 8000);
}
$("ping").onclick = askBox;
$("gear").onclick = function () { $("setcard").classList.toggle("hidden"); };
$("save").onclick = function () {
  cfg.id = $("did").value.trim() || DEFAULT_ID;
  cfg.url = $("url").value.trim() || DEFAULT_URL;
  setItem("vb-id", cfg.id);
  setItem("vb-url", cfg.url);
  $("setcard").classList.add("hidden");
  pressCount = 0; okCount = 0; failCount = 0;
  drawStats();
  addLog("⚙️ '" + cfg.id + "' 보관함에 다시 연결해요");
  connect();
};
$("wipe").onclick = function () {
  events = [];
  setItem("vb-log", "[]");
  renderLog();
};
$("testToast").onclick = function () { alertUser("try", "미리 보기 — 잠긴 보관함에 비밀번호를 입력하기 시작했어요."); };
$("testAlarm").onclick = function () { alertUser("alarm", "미리 보기 — 비밀번호가 연속으로 틀려서 입력이 막혔어요."); };

// ---------------- 화면 켜 두기 · 첫 터치 ----------------
function keepAwake() {
  try { if (navigator.wakeLock) { navigator.wakeLock.request("screen"); } } catch (e) {}
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible") { keepAwake(); }
});
document.addEventListener("pointerdown", function () {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
  } catch (e) {}
  if (opt("push")) { askNotify(); }
  keepAwake();
}, { once: true });

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function () {});
}

// ---------------- 시작 ----------------
$("did").value = cfg.id;
$("url").value = cfg.url;
drawAlertToggles();
drawDiag();
drawDots(0);
drawStats();
renderLog();
connect();
</script>
